/* LOGIN */
.login{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}
.login-card{width:100%;max-width:420px;border:1px solid var(--line);background:rgba(10,14,28,0.6);backdrop-filter:blur(8px);padding:46px 40px}
.login-logo{width:170px;height:auto;display:block;margin:0 auto 26px;filter:drop-shadow(0 0 22px rgba(170,200,240,0.18))}
.login-kicker{text-align:center;font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--silver);opacity:.82}
.login-title{text-align:center;font-family:var(--disp);font-size:26px;color:#eef3fb;margin:12px 0 28px}
label.fld{display:block;font-size:12px;color:var(--muted);margin:0 0 7px}
.inp{width:100%;font-family:var(--ar);font-size:14.5px;color:var(--text);background:rgba(7,9,16,0.6);border:1px solid var(--line);padding:12px 14px;margin-bottom:18px;transition:.2s}
.inp::placeholder{color:rgba(142,152,173,.6)}
.inp:focus{outline:none;border-color:rgba(215,230,242,.42);background:rgba(7,9,16,.8)}
.btn{font-size:13.5px;font-weight:500;color:var(--text);background:transparent;border:1px solid var(--line);padding:9px 16px;transition:.22s}
.btn:hover{border-color:rgba(215,230,242,.4);color:#fff;background:rgba(215,230,242,.04)}
.btn.solid{border-color:rgba(200,196,186,.5);color:#0a1330;background:var(--silver)}
.btn.solid:hover{background:var(--ice);border-color:var(--ice)}
.btn.full{width:100%;padding:13px;font-size:14.5px}
.err{color:#e6b8b8;font-size:12.5px;min-height:18px;margin:-8px 0 12px;text-align:center}
.demo{margin-top:24px;padding-top:20px;border-top:1px solid var(--line2);text-align:center}
.demo-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-family:'Outfit',sans-serif}
.demo-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.demo-chip{font-size:12.5px;color:var(--silver);background:transparent;border:1px solid var(--line);padding:7px 13px;transition:.2s}
.demo-chip:hover{border-color:rgba(200,196,186,.45);color:var(--ice)}

/* APP SHELL */
.app{position:relative;z-index:2;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:13px 26px;background:rgba(7,9,16,.86);backdrop-filter:blur(11px);border-bottom:1px solid var(--line)}
.tb-logo{height:26px;width:auto;opacity:.95}
.tb-spacer{margin-inline-start:auto}
.tb-client{display:flex;align-items:center;gap:11px}
.avatar{width:34px;height:34px;border:1px solid rgba(200,196,186,.5);display:grid;place-items:center;font-family:var(--disp);font-size:16px;color:var(--ice);background:rgba(200,196,186,.07)}
.tb-name{font-size:13.5px;color:var(--text)}.tb-name b{display:block;font-weight:500}.tb-name span{font-size:11.5px;color:var(--muted)}
.logout{font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--line);padding:7px 13px;transition:.2s}
.logout:hover{border-color:rgba(215,230,242,.35);color:var(--text)}
.layout{display:grid;grid-template-columns:240px 1fr;max-width:1180px;margin:0 auto;min-height:calc(100vh - 53px)}
.side{border-inline-end:1px solid var(--line);padding:30px 18px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 15px;font-size:14px;color:var(--muted);border:1px solid transparent;text-align:start;background:transparent;transition:.2s;width:100%}
.nav:hover{color:var(--text);background:rgba(215,230,242,.03)}
.nav.active{color:#0a1330;background:var(--silver);border-color:var(--silver);font-weight:500}
.nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.side-foot{margin-top:auto;padding-top:22px;border-top:1px solid var(--line2);font-family:'Outfit',sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:center}
.main{padding:38px 40px 90px;min-width:0}
.view{display:none}.view.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-kicker{font-family:'Outfit',sans-serif;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--silver);opacity:.8}
.page-title{font-family:var(--disp);font-size:clamp(26px,4vw,34px);font-weight:400;color:#eef3fb;margin:10px 0 4px;line-height:1.35}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:30px}
.divider{height:1px;background:var(--line);margin:26px 0}

/* OVERVIEW */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:34px}
.stat{border:1px solid var(--line);background:rgba(10,14,28,.5);padding:22px 22px}
.stat .lab{font-family:'Outfit',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver);opacity:.78}
.stat .val{font-family:'Cormorant Garamond',serif;font-variant-numeric:lining-nums;font-size:42px;color:#f0f5fc;line-height:1.1;margin-top:10px}
.stat .vtext{font-family:var(--disp);font-size:19px;color:#f0f5fc;margin-top:12px;line-height:1.5}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.panel{border:1px solid var(--line);background:rgba(10,14,28,.5);padding:26px 26px}
.panel h3{font-family:var(--disp);font-size:19px;font-weight:700;color:#eef3fb;margin-bottom:18px}
.act{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2)}
.act:last-child{border-bottom:0}
.act .am{width:9px;height:9px;border-radius:50%;border:1px solid rgba(219,231,244,.5);margin-top:7px;flex:none;background:radial-gradient(circle at 32% 32%,rgba(219,231,244,.5),transparent 70%)}
.act .ab{font-size:14px;color:var(--text)}.act .at{font-size:12px;color:var(--muted);margin-top:3px}

/* DELIVERABLES */
.deliv{border:1px solid var(--line);background:rgba(10,14,28,.5)}
.ditem{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line2)}
.ditem:last-child{border-bottom:0}
.dt{font-size:15px;color:#eef3fb}.dd{font-size:12px;color:var(--muted);margin-top:3px}
.dmeta{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.chipx{font-size:11px;font-family:'Outfit',sans-serif;letter-spacing:.12em;padding:5px 12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chipx.done{color:#0a1330;background:var(--silver);border-color:var(--silver)}
.chipx.review{color:var(--ice);border-color:rgba(215,230,242,.4)}
.chipx.soon{color:var(--muted)}
.dview{font-size:12.5px;color:var(--silver);background:transparent;border:1px solid var(--line);padding:7px 14px;transition:.2s}
.dview:hover{border-color:rgba(200,196,186,.45);color:var(--ice)}

/* APPROVALS */
.appr-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.progress{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--muted)}.progress b{color:var(--ice);font-family:'Outfit',sans-serif}
.track{width:120px;height:2px;background:var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(90deg,var(--silver),var(--ice));transition:width .5s}
.appr-actions{margin-inline-start:auto;display:flex;gap:9px}
.grp-head{margin:30px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.grp-head:first-child{margin-top:0}
.grp-k{font-family:'Outfit',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver);opacity:.8}
.grp-n{font-family:var(--disp);font-size:20px;color:#f2f6fc;margin-top:7px;line-height:1.4}
.grp.series .grp-n{color:#f6f2ea}
.acard{border:1px solid var(--line);background:rgba(10,14,28,.55);margin-bottom:14px;transition:.25s}
.acard.is-approve{border-color:rgba(200,196,186,.42)}
.acard.is-revise{border-color:rgba(142,152,173,.45)}
.ahead{display:flex;align-items:center;gap:13px;padding:18px 22px;cursor:pointer}
.anum{font-family:'Cormorant Garamond',serif;font-variant-numeric:lining-nums;font-size:26px;color:var(--silver);line-height:1}
.adate{font-size:12px;color:var(--muted);font-family:'Outfit',sans-serif}
.asubj{font-family:var(--disp);font-size:16.5px;color:#f0f5fc;flex:1;min-width:0;line-height:1.5}
.apart{font-family:var(--disp);font-size:12px;color:var(--silver);border:1px solid rgba(200,196,186,.4);padding:3px 11px;white-space:nowrap}
.astatus{font-size:10.5px;font-family:'Outfit',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:4px 10px;white-space:nowrap}
.acard.is-approve .astatus{color:#0a1330;background:var(--silver);border-color:var(--silver)}
.acard.is-revise .astatus{color:var(--ice);border-color:rgba(215,230,242,.35)}
.acaret{color:var(--muted);font-size:12px;transition:.25s}
.acard.open .acaret{transform:rotate(180deg)}
.abody{display:none;padding:0 22px 22px;border-top:1px solid var(--line2)}
.acard.open .abody{display:block}
.fl{display:block;font-family:'Outfit',sans-serif;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--silver);opacity:.78;margin:18px 0 7px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 22px;margin:6px 0 4px}
.meta{font-size:12.5px;color:var(--muted)}.meta b{color:var(--silver);font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-inline-end:6px}
.hook{font-family:var(--disp);font-size:17px;color:var(--ice);line-height:1.7;border-inline-start:2px solid rgba(215,230,242,.3);padding-inline-start:14px}
.btext p{font-size:15px;color:var(--text);margin-bottom:10px;line-height:1.95}
.btext p.item{padding-inline-start:18px;color:#cfd8e6}
.tags{font-size:13px;color:var(--silver);line-height:2}
.review{margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.chips{display:flex;gap:9px;margin-bottom:11px}
.chip{font-size:12.5px;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line);padding:7px 15px;transition:.2s}
.chip:hover{color:var(--text);border-color:rgba(215,230,242,.3)}
.acard.is-approve .chip[data-act=approve]{color:#0a1330;background:var(--silver);border-color:var(--silver)}
.acard.is-revise .chip[data-act=revise]{color:var(--ice);background:rgba(215,230,242,.07);border-color:rgba(215,230,242,.4)}
.cmt{width:100%;font-family:var(--ar);font-size:14px;color:var(--text);line-height:1.8;background:rgba(7,9,16,.5);border:1px solid var(--line);padding:11px 13px;resize:vertical}
.cmt:focus{outline:none;border-color:rgba(215,230,242,.4);background:rgba(7,9,16,.7)}
.empty{border:1px dashed var(--line);padding:50px 30px;text-align:center;color:var(--muted);font-size:14.5px}

/* PROFILE / SETTINGS */
.kv{display:flex;padding:15px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.kv:last-child{border-bottom:0}.kv .k{width:160px;color:var(--muted);flex:none}.kv .v{color:#eef3fb}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--silver);color:#0a1330;font-size:13.5px;font-weight:500;padding:11px 22px;opacity:0;pointer-events:none;transition:.35s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:780px){
  .layout{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap;border-inline-end:0;border-bottom:1px solid var(--line);padding:14px;gap:8px;position:sticky;top:53px;z-index:20;background:rgba(7,9,16,.86);backdrop-filter:blur(10px)}
  .nav{width:auto;padding:9px 13px;font-size:13px}.nav .dot{display:none}.side-foot{display:none}
  .main{padding:26px 18px 80px}.topbar{padding:11px 16px}.tb-name span{display:none}
}
</style>
</head>

سي وليس تعثراً؟", "1- مأسسة الإبداع: نجاح \"ثمانية\" في بناء نظام تشغيلي (System) مستقل عن الأفراد طوال السنوات الماضية هو ما جعلها جاذبة للاستحواذ أصلاً.", "2- استراتيجية الخروج (Exit Strategy): القائد الذكي هو من يبني منظومة تستطيع النمو والعمل بكفاءة حتى لو قرر هو الترجل من منصبه.", "3- انتقال القيادة السلس: الإعلان الهادئ والمنظم يعكس وجود خطط تعاقب (Succession Planning) مدروسة مسبقاً.", "كمؤسس أو مدير مشروع.", "هل بنيت منظومتك لتعتمد على \"وجودك الدائم\"، أم لتستمر وتكبر في غيابك؟", "كل التوفيق لبو مالح في رحلته القادمة، ولـ \"ثمانية\" في فصلها الجديد."], "tags": "#إدارة_المشاريع #استمرارية_الأعمال #ثمانية #قيادة"}, {"n": 3, "group": "الأسبوع الأول", "kind": "", "part": "", "day": "الجمعة", "date": "5 - 6 - 2026", "subject": "قصة شخصية عن خطأ إداري قديم.", "why": "حس إنساني وبناء أصالة وثقة مع المتابعين.", "form": "أسلوب قصصي (Storytelling).", "hook": "الاعتراف الصعب: خطأ إداري كلفني عميلاً وعلّمني قيادة الفريق..", "body": ["في بداياتي كمدير مشاريع، كنت مؤمناً بأن \"النتائج هي كل شيء\". وفي أحد المشاريع الحساسة، وقع ضغط كبير من العميل لتعديل المخرجات في وقت قياسي.", "بدلاً من حماية فريقي، قمت بنقل الضغط مباشرة إليهم. ألغيت الإجازات، وزدت ساعات العمل، وكنت أتابع أدق التفاصيل بصرامة (Micromanagement).", "النتيجة؟ تسلم المشروع في وقته، ولكن: انهار شغف الفريق، استقال مهندس أساسي بعد أسبوع، وخسرنا العميل نفسه في المشروع التالي لأن الروح الإبداعية في العمل اختفت!", "يومها تعلمت درساً قاسياً: \"المدير الفاشل يحمي الأرقام على حساب البشر، والقائد الناجح يحمي البشر وهم من يحمون له الأرقام.\"", "المشاريع تنتهي وتُسلم، ولكن ثقافة الفريق وعلاقته بك هي رأس مالك الحقيقي المستدام.", "جمعة مباركة، وأتمنى لكم ولفرقكم عطلة أسبوع مريحة."], "tags": "#قصص_إدارية #قيادة_الفريق #الإنسان_أولاً #إدارة_المشاريع"}, {"n": 2, "group": "سلسلة: كيف تجذب السعودية المستثمر العالمي في زمن الأزمات", "kind": "series", "part": "الجزء الأول", "day": "الأربعاء", "date": "3 - 6 - 2026", "subject": "كيف تجذب السعودية كبار المستثمرين في زمن الأزمات (جزء 1).", "why": "تثقيفي رسمي يستعرض القوة الاقتصادية للمملكة.", "form": "منشور رسمي مدعم بالحقائق.", "hook": "عندما تتصاعد الأحداث وتتوتر الأسواق: كيف تجذب السعودية كبار المستثمرين في زمن الأزمات؟ (1/3)", "body": ["في عالم المال والأعمال، هناك قاعدة ذهبية: \"رأس المال جبان، لكنه يبحث دائماً عن الملاذ الآمن\".", "في وقت تشهد فيه الساحة الدولية والجيوسياسية تقلبات كبرى، نرى تدفقاً مستمراً لكبار المستثمرين والشركات العالمية نحو المملكة العربية السعودية. هذا ليس وليد الصدفة، بل هو نتيجة هندسة استراتيجية دقيقة لبيئة المخاطر (Risk Management).", "كيف تحولت المخاطر الإقليمية إلى فرص جاذبة في المملكة؟", "1- الاستقرار التشريعي: المستثمر الأجنبي لا يخاف من الضرائب بقدر ما يخاف من المفاجأة فوضوح القوانين الاستثمارية وتطوير البيئة العدلية التجارية في المملكة وفّر \"عنصر التنبؤ\" الهام للمشاريع المليارية.", "وذلك عن طريق توفر العنصر النادر في ظل تصاعد الأحداث وهو \"الأمان\"، والبيئة المستقرة للأحداث.", "2- الحوكمة الشفافة: تطبيق معايير عالمية في مكافحة البيروقراطية وسرعة إصدار التراخيص قلص \"زمن الاستجابة للأسواق\" (Time to Market).", "عندما تنجح في تحويل البيئة المحيطة بك إلى منطقة \"صفر مفاجآت\"، سيتسابق إليك العمالقة حتى في أشد الأوقات حرجاً.", "في المنشور القادم، سنتحدث عن دور الصناديق السيادية كأداة تحوط وجذب."], "tags": "#رؤية_السعودية_2030 #الاستثمار_الأجنبي #إدارة_المخاطر #اقتصاد"}, {"n": 4, "group": "سلسلة: كيف تجذب السعودية المستثمر العالمي في زمن الأزمات", "kind": "series", "part": "الجزء الثاني", "day": "الأحد", "date": "7 - 6 - 2026", "subject": "أمن الطاقة والتحوط السيادي (جزء 2).", "why": "بناء سلطة معرفية (Authority) كخبير استراتيجي.", "form": "منشور رسمي رصين.", "hook": "أمن الطاقة والتحوط السيادي: السعودية والمستثمر الأجنبي (2/3)", "body": ["عندما ينظر المستثمر العالمي إلى مشاريع الرؤية في المملكة، هو لا يرى مجرد مبانٍ شاهقة أو مدن ذكية، بل يرى \"منظومة تحوط استراتيجي\" (Strategic Hedging) متكاملة ضد تقلبات الاقتصاد التقليدي.", "في الجزء الثاني من سلسلتنا، نناقش كيف تدار المخاطر في مشاريع بمليارات الدولارات:", "1- تنويع المحفظة الاستثمارية (Portfolio Diversification): من خلال صندوق الاستثمارات العامة (PIF)، نجحت المملكة في عدم وضع البيض كله في سلة النفط، مما أعطى مرونة (Resilience) مالية للمشاريع الكبرى مثل نيوم والقدية والبحر الأحمر.", "2- دمج الطاقة المتجددة بالصناعات الثقيلة: ربط المدن الصناعية الجديدة (مثل مدن الهيدروجين الأخضر) بالطاقة المستدامة، يضمن للمستثمر خفض تكاليف التشغيل على المدى الطويل ويحميه من تقلبات أسعار الطاقة العالمية.", "إدارة المشاريع العملاقة (Mega Projects) تتطلب نَفَساً استراتيجياً يرى أثر القرار الاستثماري بعد 10 و 20 سنة من الآن.", "في المنشور القادم، نختم السلسلة بالحديث عن كيفية تهيئة المشاريع المحلية لتكون \"جاهزة للاستثمار العالمي\"."], "tags": "#صندوق_الاستثمارات_العامة #إدارة_المحافظ #رؤية_2030 #استراتيجية"}, {"n": 8, "group": "سلسلة: كيف تجذب السعودية المستثمر العالمي في زمن الأزمات", "kind": "series", "part": "الجزء الثالث", "day": "الإثنين", "date": "15 - 6 - 2026", "subject": "كيف تبني الشركات المحلية آلية دفاع تجذب المستثمر (جزء 3).", "why": "تقديم حلول عملية واختتام السلسلة الاقتصادية.", "form": "منشور ملخص بنقاط تنفيذية (Actionable).", "hook": "المستثمر لا يبحث عن فكرة.. يبحث عن \"آلية دفاع\" (3/3 والأخير)", "body": ["نختم سلسلتنا حول جذب الاستثمارات بالسؤال الأهم لكل صاحب شركة أو مشروع محلي: كيف تهيئ منظومتك لتكون شريكاً جذاباً للعمالقة الداخليين أو الدوليين في المملكة؟", "المستثمر الذكي لا يشتري أفكاراً، بل يشتري \"أنظمة تشغيل مرنة\" (Scalable Systems). إليك 3 ركائز يجب بناؤها في مشروعك الآن:", "- مأسسة العمليات (Process Institutionalization): تأكد أن طريقة سير العمل موثقة بوضوح (SOPs) وليست محفوظة في عقول الموظفين فقط. إذا غاب شخص، لا يجب أن يقف المشروع.", "- إدارة المخاطر الاستباقية: أظهر للمستثمر أنك تملك (Plan B) جاهزة ومسعرة لكل خطر محتمل (تأخر سلاسل الإمداد، تغير القوانين، تقلبات السوق).", "- الحوكمة والشفافية المالية: التقارير المالية المنظمة والمدققة تعطي انطباعاً فورياً بالجدية وتقلل من فترات الفحص النافي للجهالة (Due Diligence).", "عندما تبني مشروعك بعقلية \"المؤسسة العالمية\" منذ اليوم الأول، ستجد أن رؤوس الأموال هي من تبحث عنك.", "يمكنك قراءة الأجزاء السابقة عبر ملفي الشخصي."], "tags": "#تطوير_الأعمال #الحوكمة #جذب_الاستثمار #استراتيجية_الشركات"}, {"n": 5, "group": "الأسبوع الثاني", "kind": "", "part": "", "day": "الثلاثاء", "date": "9 - 6 - 2026", "subject": "العميل يطلب تعديلاً ينسف الجدول الزمني قُبيل التسليم بـ 48 ساعة.", "why": "نقاش تفاعلي يمس معضلة يومية لكل المدراء.", "form": "سؤال مفتوح للجمهور لرفع التفاعل.", "hook": "معضلة الثلاثاء: عندما يطلب العميل تعديلاً ينسف الجدول الزمني قبل التسليم بـ 48 ساعة", "body": ["السيناريو المتكرر: المشروع شارف على الانتهاء، الفريق مستنزف وينتظر لحظة الإغلاق، فجأة يصل إيميل من العميل: \"نريد تغيير هذه الخاصية الجوهرية، ونريد التسليم في نفس الموعد\"", "كيف تتصرف كمدير مشروع دون أن تخسر العميل ودون أن تكسر ظهر الفريق؟", "من تجربتي، كلمة \"نعم\" الفورية هي انتحار مهني، وكلمة \"لا\" الجافة هي خسارة تسويقية. الحل يكمن في \"إدارة التوقعات\" (Expectation Management) من خلال مثلث إدارة المشاريع الشهير (نطاق العمل، الوقت، التكلفة):", "أهلاً بالعميل، هذا التغيير رائع وسيضيف قيمة (مرحلة الاستيعاب).", "ولكن، تطبيق هذا التعديل يتطلب (X) من الساعات الإضافية، وبالتالي تمديد موعد التسليم لـ (Y) أو ميزانية إضافية لفرز موارد جديدة (مرحلة لغة الأرقام).", "الخيار لك: هل نسلم النسخة الحالية في موعدها ونؤجل التعديل للمرحلة القادمة، أم نعدل الخطة الآن؟", "عندما تضع العميل أمام \"التبعات والخيارات\" بالأرقام، يتحول من موقف \"المطالب\" إلى موقف \"الشريك في القرار\".", "شاركوني في التعليقات: كيف تتعاملون مع طلبات اللحظات الأخيرة؟"], "tags": "#نطاق_العمل #إدارة_العملاء #ScopeCreep #LinkedInEngagement"}, {"n": 6, "group": "الأسبوع الثاني", "kind": "", "part": "", "day": "الخميس", "date": "11 - 6 - 2026", "subject": "إعادة هيكلة وتأخير بعض المشاريع في المملكة.", "why": "قراءة إدارية ذكية لقضية اقتصادية ساخنة.", "form": "تحليل استراتيجي بلغة الـ Business.", "hook": "المشاريع الكبرى في المملكة: لماذا يعتبر \"التأجيل\" أحياناً ذروة النجاح الاستراتيجي؟", "body": ["يرى البعض في قرار إعادة هيكلة أو تمديد الجداول الزمنية لبعض المشاريع الكبرى في المملكة علامة تعثر، بينما يراها خبراء إدارة المشاريع الحقيقيون علامة \"نضج ونمو متسارع\".", "في علم إدارة المحافظ الاستراتيجية (Portfolio Management)، الإصرار على تنفيذ كل شيء بالتوازي رغم تغير المعطيات الاقتصادية هو الفشل بعينه.", "لماذا تعد إعادة الهيكلة الحالية خطوة ذكية؟", "1- إعادة توازن الموارد (Resource Leveling): الضغط على المقاولين والمواد والمواهب البشرية في وقت واحد يرفع التكاليف ويقلل الجودة. التمهل يمنح السوق فرصة للتنفس والاستيعاب.", "2- ترتيب الأولويات الاستراتيجية: التركيز على المشاريع ذات العائد السريع والأثر المباشر في المرحلة الحالية يدعم استدامة التدفقات النقدية للمشاريع الأكثر تعقيداً لاحقاً.", "3- مرونة التخطيط (Agility): الخطط الاستراتيجية ليست قرآناً منزلاً؛ القدرة على المناورة والمراجعة هي ما يميز الإدارات المرنة عن الإدارات البيروقراطية الجامدة.", "العبرة ليست بمن ينتهي أولاً، بل بمن يبني بجودة مستدامة تخدم الأجيال القادمة."], "tags": "#المشاريع_العملاقة #إعادة_الهيكلة #التخطيط_الاستراتيجي #كفاءة_الإنفاق"}, {"n": 7, "group": "الأسبوع الثاني", "kind": "", "part": "", "day": "السبت", "date": "13 - 6 - 2026", "subject": "الضغط النفسي والإداري الذي يتعرض له المدراء.", "why": "حس إنساني يلامس مشاعر القادة والمدراء التنفيذيين.", "form": "منشور وجداني/تأملي (Reflective).", "hook": "الحكمة الصامتة: خلف كل مدير صارم حكاية لا يعرفها الموظفون.", "body": ["في عالم الشركات، غالباً ما يتم تصوير \"المدير\" على أنه الشخص المرتاح الذي يوزع المهام ويراقب العقارب. لكن الواقع الذي نعيشه في غرف الاجتماعات المغلقة مختلف تماماً.", "المدير الذكي يعيش دائماً بين مطرقة الإدارة العليا (التي تطالب بأرقام ومستهدفات شبه مستحيلة)، وسندان الفريق (الذي يعاني من الضغط ويطلب الدعم والمرونة).", "- عندما يواجه مجلس الإدارة لحماية ميزانية فريقه.. لا أحد يرى.", "- عندما يقضي ليلته يفكر في كيفية تجنب تسريح موظف قصرت أرقامه.. لا أحد يرى.", "- عندما يمتص غضب عميل ثائر ليبقى فريقه في بيئة عمل هادئة.. لا أحد يرى.", "الإدارة ليست سلطة، الإدارة هي \"امتصاص الصدمات\".", "وتحية لكل قائد يحمل عبء حماية فريقه بصمت، ويظهر لهم مبتسماً كل صباح ليقودهم نحو النجاح.", "زملائي المدراء.. كيف توازنون بين ضغط الأرقام وإنسانية القيادة؟"], "tags": "#صناع_القرار #البيئة_المؤسسية #الصحة_المهنية #القيادة_بالإيجابية"}, {"n": 9, "group": "الأسبوع الثالث", "kind": "", "part": "", "day": "الأربعاء", "date": "17 - 6 - 2026", "subject": "هل يقضي الذكاء الاصطناعي على مدراء المشاريع؟", "why": "مواكبة ترند التقنية وربطه بالجانب الإنساني.", "form": "منشور نقاشي مدعم بأمثلة.", "hook": "هل يقضي الذكاء الاصطناعي على مدراء المشاريع؟ (الرد الحقيقي)", "body": ["مع التطور المتسارع لأدوات الذكاء الاصطناعي وقدرتها على جدولة المهام، كتابة التقارير، وتوقع الميزانيات بدقة مذهلة، يتردد سؤال مقلق: هل سنصبح خارج الخدمة قريباً؟", "الإجابة المختصرة: الذكاء الاصطناعي لن يستبدل مدير المشروع، بل سيستبدل المدير الذي لا يستخدم الذكاء الاصطناعي.", "الأتمتة (Automation) ستأخذ منا الجانب الجاف والبيروقراطي من الوظيفة:", "- صياغة جداول الـ Gantt وتتبع الـ KPIs.", "- كتابة محاضر الاجتماعات وتحديث مصفوفة المخاطر.", "لكن، ما الذي لا يمكن للذكاء الاصطناعي أتمتته؟", "- قراءة ما بين السطور: نبرة صوت موظف محبط يحتاج إلى دعم.", "- فن التفاوض: إقناع عميل متردد بقرار استراتيجي صعب.", "- بناء الثقافة والولاء: تحفيز الفريق عندما تنهار المعنويات في منتصف المشروع.", "ميزتنا التنافسية القادمة هي \"إنسانيتنا ومهاراتنا الناعمة\" (Soft Skills). استخدم الأدوات لتتحرر من الأوراق، وتتفرغ لقيادة البشر.", "ما هي أكثر أداة ذكاء اصطناعي ساعدتكم في إدارة مشاريعكم مؤخراً؟"], "tags": "#الذكاء_الاصطناعي #مستقبل_العمل #إدارة_المشاريع #المهارات_الناعمة"}, {"n": 10, "group": "الأسبوع الثالث", "kind": "", "part": "", "day": "الجمعة", "date": "19 - 6 - 2026", "subject": "انصر فريقك في العلن، وعاتبه في السر.", "why": "حكمة وأخلاقيات قيادية تعزز فلسفة \"أنسنة الإدارة\".", "form": "منشور قصير ومباشر (Quote-style).", "hook": "\"انصر فريقك في العلن.. وعاتبه في السر.\"", "body": ["واحدة من أثمن القواعد الإدارية التي تحول \"المدير\" إلى \"قائد\" يفتديه فريقه.", "عندما يخطئ أحد أعضاء فريقك في اجتماع مع أطراف خارجية أو إدارة عليا:", "- إياك أن تلومه أو توبخه أمامهم لتبرئ نفسك. مسؤوليته هي مسؤوليتك أنت أولاً وأخيراً أمام الجميع. دافع عنه، خذ الرصاصة بدلاً منه، وتعهد بإصلاح الأمر.", "وعندما تغلقون باب مكتبكم الخاص:", "هنا يأتي وقت الحساب، التوجيه، وتفكيك الخطأ بصرامة وحب، ليتعلم ويفهم كيف لا يكررها.", "الأمان النفسي (Psychological Safety) الذي تمنحه لفريقك في لحظات الخطأ، هو الذي يصنع ولاءهم، وهو الذي يجعلهم يقدمون 200% من طاقتهم في الأوقات الحرجة لأنهم يعلمون أن خلفهم \"ظهر يحميهم\".", "جمعة طيبة ومباركة للجميع."], "tags": "#أخلاقيات_القيادة #الأمان_النفسي #بناء_الفرق #ثقافة_العمل"}, {"n": 11, "group": "الأسبوع الثالث", "kind": "", "part": "", "day": "الأحد", "date": "21 - 6 - 2026", "subject": "هندسة الأولويات لإنقاذ مشروع متعثر.", "why": "دليل تثقيفي بحت يقدم قيمة عملية ممتازة للحفظ والـ Share.", "form": "دليل خطوة بخطوة (How-to Guide).", "hook": "هندسة الأولويات: كيف تنقذ مشروعاً يغرق بسبب سوء الهيكلة؟", "body": ["إذا استلمت إدارة مشروع متعثر، الميزانية تنزف، المواعيد تتأخر، والمعنويات في الحضيض.. لا تبدأ بالصراخ أو زيادة ساعات العمل. ابدأ بـ \"إعادة الهندسة\" عبر هذه الخطوات الثلاث:", "1- تجميد النطاق (Scope Freeze): أوقف فوراً استقبال أي طلبات تعديل جديدة من العميل. ركز فقط على \"الحد الأدنى من المخرجات الصالحة للتشغيل\" (MVP) لتعيد للمشروع توازنه.", "3- إعادة فرز الموارد (Resource Audit): غالباً ما يكون التعثر بسبب وضع الشخص المناسب في المكان غير المناسب، أو تحميل مهندس واحد فوق طاقته بينما الآخرون في حالة انتظار. أعد توزيع المهام بناءً على الكفاءة اللحظية لا المسميات الجافة.", "4- شفافية التواصل (Over-communication): اعقد اجتماعاً صريحاً مع العميل والممولين. اعرض الواقع بالأرقام، وقدم الخطة الجديدة المعدلة. الصدمة بالحقائق الآن أفضل بكثير من الخيبة عند نهاية الموعد.", "إنقاذ المشاريع لا يحتاج إلى معجزات، يحتاج إلى شجاعة إدارية لرسم خط أحمر، والبدء من جديد بترتيب أولويات صحيح.", "انصح بحفظ المنشور للرجوع إليه عند الحاجة لتعديل مسار مشاريعكم."], "tags": "#إدارة_الأزمات #إنقاذ_المشاريع #إعادة_الهيكلة #دليل_عملي"}, {"n": 12, "group": "الأسبوع الرابع والأخير", "kind": "", "part": "", "day": "الثلاثاء", "date": "23 - 6 - 2026", "subject": "المدير الـ Micromanager: هل هو صعب أم ضحية؟", "why": "قضايا ترند إداري دائم الجاذبية، يطرح زاوية إنسانية مختلفة.", "form": "منشور نقاشي يوازن بين وجهتي نظر.", "hook": "المدير الـ Micromanager: هل const CLIENTS=DATA.clients, PLAN=DATA.plan;
const SKEY='moona_portal_v1';
let store={session:null,data:{}};
try{store=Object.assign(store,JSON.parse(localStorage.getItem(SKEY)||'{}'));}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(store));}catch(e){}}
function byId(id){return CLIENTS.find(c=>c.id===id);}
let current=null;

/* ---------- LOGIN ---------- */
const demoRow=document.getElementById('demoRow');
CLIENTS.forEach(c=>{const b=document.createElement('button');b.className='demo-chip';b.textContent='دخول كـ '+c.first;b.onclick=()=>login(c.id);demoRow.appendChild(b);});
document.getElementById('signin').onclick=()=>{
  const em=document.getElementById('email').value.trim().toLowerCase();
  const pw=document.getElementById('pass').value;
  const c=CLIENTS.find(x=>x.email.toLowerCase()===em);
  const err=document.getElementById('err');
  if(!c){err.textContent='لا يوجد حساب بهذا البريد. جرّب الدخول التجريبي بالأسفل.';return;}
  if(!pw){err.textContent='أدخل كلمة المرور.';return;}
  err.textContent='';login(c.id);
};
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('signin').click();});

function login(id){current=id;store.session=id;persist();render();
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');window.scrollTo(0,0);}
document.getElementById('logout').onclick=()=>{store.session=null;persist();current=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('email').value='';document.getElementById('pass').value='';};

/* ---------- NAV ---------- */
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));n.classList.add('active');
  const v=n.dataset.view;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');window.scrollTo(0,0);
});

/* ---------- STATE PER CLIENT ---------- */
function cdata(){store.data[current]=store.data[current]||{};return store.data[current];}
function counts(){let a=0,r=0,p=0;const d=cdata();PLAN.forEach(po=>{const s=(d[po.n]||{}).status;if(s==='approve')a++;else if(s==='revise')r++;else p++;});return{a,r,p};}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isItem(s){return /^\s*-\s/.test(s)||/^\d+-\s/.test(s);}

/* ---------- RENDER ---------- */
function render(){const c=byId(current);
  document.getElementById('tbName').textContent=c.name;
  document.getElementById('tbRole').textContent=c.role+' · '+c.company;
  document.getElementById('tbAvatar').textContent=c.initial;
  renderHome(c);renderApprovals(c);renderDeliverables(c);renderProfile(c);renderSettings(c);
}
function statusLabel(s){return s==='approve'?'معتمد':(s==='revise'?'يحتاج تعديل':'بانتظار المراجعة');}

function renderHome(c){const k=counts();const hasP=c.has_plan;
  const el=document.getElementById('view-home');
  el.innerHTML=`
   <div class="page-kicker">لوحة التحكم</div>
   <h1 class="page-title">مساءُ الخير، ${esc(c.first)}</h1>
   <p class="page-sub">${esc(c.plan)} · المرحلة الحالية: ${esc(c.phase)}</p>
   <div class="stat-grid">
     <div class="stat"><div class="lab">بانتظار مراجعتك</div><div class="val">${hasP?k.p:0}</div><div class="sub">منشور يحتاج قرارك</div></div>
     <div class="stat"><div class="lab">معتمدة</div><div class="val">${hasP?k.a:0}</div><div class="sub">جاهزة للنشر</div></div>
     <div class="stat"><div class="lab">تحتاج تعديل</div><div class="val">${hasP?k.r:0}</div><div class="sub">بانتظار التعديل</div></div>
     <div class="stat"><div class="lab">القادم</div><div class="vtext">${esc(c.next)}</div></div>
   </div>
   <div class="panel">
     <h3>آخر التحديثات</h3>
     <div class="act"><span class="am"></span><div><div class="ab">${hasP?'تقويم المحتوى لشهر يونيو ويوليو جاهز لمراجعتك':'جلسة الاكتشاف قيد الجدولة'}</div><div class="at">${hasP?'16 منشوراً · افتح تبويب «الموافقة على المحتوى»':'سنرسل لك المواعيد المقترحة قريباً'}</div></div></div>
     <div class="act"><span class="am"></span><div><div class="ab">${hasP?'تم تحديث قسم «نبذة عني» والعنوان المهني':'بدء العمل على الهوية البصرية'}</div><div class="at">ضمن ${esc(c.plan)}</div></div></div>
     <div class="act"><span class="am"></span><div><div class="ab">${esc(c.next)}</div><div class="at">سيصلك تذكير قبل الموعد</div></div></div>
   </div>`;
}

function renderApprovals(c){const el=document.getElementById('view-approvals');
  if(!c.has_plan){el.innerHTML=`<div class="page-kicker">الموافقة على المحتوى</div><h1 class="page-title">لا توجد منشورات بعد</h1><p class="page-sub">سيظهر تقويم المحتوى هنا فور جاهزيته للمراجعة.</p><div class="empty">لا توجد منشورات للمراجعة حالياً.</div>`;return;}
  let html=`<div class="page-kicker">الموافقة على المحتوى</div><h1 class="page-title">تقويم المحتوى · يونيو ويوليو 2026</h1><p class="page-sub">راجع كل منشور: اعتمده للنشر أو اطلب تعديلاً واكتب ملاحظتك. تُحفظ قراراتك تلقائياً.</p>
   <div class="appr-bar"><div class="progress"><span>تمت مراجعة <b id="aDone">0</b> من ${PLAN.length}</span><span class="track"><i id="aFill"></i></span></div>
   <div class="appr-actions"><button class="btn" id="aCopy">نسخ الملاحظات</button><button class="btn solid" id="aDl">تنزيل الملاحظات</button></div></div>`;
  let grp=null;
  PLAN.forEach(po=>{
    if(po.group!==grp){grp=po.group;const ser=po.kind==='series';
      html+=`<div class="grp ${ser?'series':''}"><div class="grp-head"><div class="grp-k">${ser?'سلسلة مترابطة':'أسبوع'}</div><div class="grp-n">${esc(po.group)}</div></div></div>`;}
    const body=po.body.map(p=>`<p class="${isItem(p)?'item':''}">${esc(p)}</p>`).join('');
    const part=po.part?`<span class="apart">${esc(po.part)}</span>`:'';
    html+=`<article class="acard" data-n="${po.n}">
      <div class="ahead">
        <span class="anum">${String(po.n).padStart(2,'0')}</span>
        <span class="adate">${esc(po.day)} · ${esc(po.date)}</span>
        <span class="asubj">${esc(po.subject)}</span>
        ${part}
        <span class="astatus">بانتظار المراجعة</span>
        <span class="acaret">▾</span>
      </div>
      <div class="abody">
        <div class="meta-row"><span class="meta"><b>لماذا الآن</b>${esc(po.why)}</span><span class="meta"><b>الشكل</b>${esc(po.form)}</span></div>
        <span class="fl">الخطّاف</span><p class="hook">${esc(po.hook)}</p>
        <span class="fl">نص المنشور</span><div class="btext">${body}</div>
        <span class="fl">الوسوم</span><p class="tags">${esc(po.tags)}</p>
        <div class="review">
          <div class="chips"><button class="chip" data-act="approve">موافق للنشر</button><button class="chip" data-act="revise">يحتاج تعديل</button></div>
          <textarea class="cmt" rows="2" placeholder="اكتب ملاحظتك أو موافقتك هنا"></textarea>
        </div>
      </div>
    </article>`;
  });
  el.innerHTML=html;
  const d=cdata();
  el.querySelectorAll('.acard').forEach(card=>{
    const n=card.dataset.n;const st=d[n]||{};
    applyCard(card,st);
    card.querySelector('.ahead').addEventListener('click',e=>{if(e.target.closest('.chip')||e.target.closest('.cmt'))return;card.classList.toggle('open');});
    card.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{const dd=cdata();dd[n]=dd[n]||{};const a=ch.dataset.act;dd[n].status=(dd[n].status===a)?null:a;persist();applyCard(card,dd[n]);updProgress();}));
    const ta=card.querySelector('.cmt');if(st.comment)ta.value=st.comment;
    ta.addEventListener('input',e=>{const dd=cdata();dd[n]=dd[n]||{};dd[n].comment=e.target.value;persist();});
  });
  document.getElementById('aCopy').onclick=async()=>{const t=report(c);try{await navigator.clipboard.writeText(t);toast('نُسخت الملاحظات');}catch(e){toast('تعذّر النسخ، استخدم التنزيل');}};
  document.getElementById('aDl').onclick=()=>{const b=new Blob([report(c)],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ملاحظات-'+c.first+'-Moona-2026.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('تم التنزيل');};
  updProgress();
}
function applyCard(card,st){card.classList.toggle('is-approve',st.status==='approve');card.classList.toggle('is-revise',st.status==='revise');card.querySelector('.astatus').textContent=statusLabel(st.status);}
function updProgress(){const k=counts();const done=k.a+k.r;const dn=document.getElementById('aDone');if(dn){dn.textContent=done;document.getElementById('aFill').style.width=(PLAN.length?done/PLAN.length*100:0)+'%';}
  const c=byId(current);renderHome(c);}
function report(c){let o='ملاحظات '+c.name+' — تقويم المحتوى\\nMoona · 2026\\n';const d=cdata();let g=null;
  PLAN.forEach(po=>{if(po.group!==g){g=po.group;o+='\\n=== '+g+' ===\\n';}const s=d[po.n]||{};o+='\\n'+String(po.n).padStart(2,'0')+' ('+po.date+')\\nالموضوع: '+po.subject+'\\nالحالة: '+statusLabel(s.status)+'\\nالملاحظة: '+(s.comment&&s.comment.trim()?s.comment.trim():'—')+'\\n';});
  return o;}

function renderDeliverables(c){const el=document.getElementById('view-deliverables');
  const cls=s=>s==='تم التسليم'?'done':(s==='بانتظار المراجعة'?'review':'soon');
  const rows=c.deliverables.map(d=>`<div class="ditem"><div><div class="dt">${esc(d.t)}</div><div class="dd">${esc(d.d)}</div></div>
    <div class="dmeta"><span class="chipx ${cls(d.s)}">${esc(d.s)}</span><button class="dview">عرض</button></div></div>`).join('');
  el.innerHTML=`<div class="page-kicker">المخرجات</div><h1 class="page-title">مخرجاتك</h1><p class="page-sub">كل ما سلّمناه أو قيد العمل عليه ضمن ${esc(c.plan)}.</p><div class="deliv">${rows}</div>`;
  el.querySelectorAll('.dview').forEach(b=>b.onclick=()=>toast('العرض متاح في النسخة الكاملة'));
}
function renderProfile(c){document.getElementById('view-profile').innerHTML=`<div class="page-kicker">الملف الشخصي</div><h1 class="page-title">${esc(c.name)}</h1><p class="page-sub">معلومات حسابك لدى Moona.</p>
  <div class="panel"><div class="kv"><span class="k">الاسم</span><span class="v">${esc(c.name)}</span></div>
  <div class="kv"><span class="k">المنصب</span><span class="v">${esc(c.role)}</span></div>
  <div class="kv"><span class="k">الجهة</span><span class="v">${esc(c.company)}</span></div>
  <div class="kv"><span class="k">البريد</span><span class="v" dir="ltr" style="text-align:right">${esc(c.email)}</span></div>
  <div class="kv"><span class="k">الباقة</span><span class="v">${esc(c.plan)}</span></div>
  <div class="kv"><span class="k">المرحلة</span><span class="v">${esc(c.phase)}</span></div></div>`;
}
function renderSettings(c){document.getElementById('view-settings').innerHTML=`<div class="page-kicker">الإعدادات</div><h1 class="page-title">الإعدادات</h1><p class="page-sub">حدّث بياناتك وتفضيلات الإشعارات.</p>
  <div class="panel" style="max-width:480px">
   <label class="fld">الاسم</label><input class="inp" value="${esc(c.name)}">
   <label class="fld">البريد الإلكتروني</label><input class="inp" dir="ltr" value="${esc(c.email)}">
   <label class="fld">كلمة مرور جديدة</label><input class="inp" type="password" placeholder="••••••••">
   <button class="btn solid" id="saveSettings" style="margin-top:6px">حفظ التغييرات</button>
  </div>`;
  document.getElementById('saveSettings').onclick=()=>toast('الحفظ متاح في النسخة الكاملة');
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* resume session */
if(store.session && byId(store.session)){login(store.session);}
</script>
</body></html>
